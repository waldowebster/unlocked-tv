[project]
name = "unlocked-tv"
version = "0.1.0"
description = "An owner-controlled, remote-first TV shell for Raspberry Pi"
requires-python = ">=3.11"
dependencies = ["pygame-ce>=2.5,<2.6"]

[project.scripts]
unlocked-tv = "unlocked_tv.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["unlocked_tv"]
